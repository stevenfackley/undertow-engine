# ---------------------------------------------------------------------------
# nginx reverse proxy — single server, two applications
#
# Routing:
#   roastandresolve.com          →  roast-nextjs:3000   (Next.js frontend)
#   api.roastandresolve.com      →  roast-api:8000      (Roast FastAPI)
#   api.undertow.dev             →  undertow-api:8001   (Undertow FastAPI)
#
# Container DNS names come from container_name in each app's docker-compose.
# All containers must be attached to shared_proxy_network.
# ---------------------------------------------------------------------------

events {
    worker_connections 2048;
}

http {
    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect (all domains)
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------------
    # roastandresolve.com  →  Next.js frontend (roast-nextjs:3000)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name roastandresolve.com www.roastandresolve.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            SAMEORIGIN                                    always;
        add_header X-Content-Type-Options     nosniff                                       always;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://roast-nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ---------------------------------------------------------------------------
    # api.roastandresolve.com  →  Roast FastAPI (roast-api:8000)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name api.roastandresolve.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options     nosniff                                       always;

        client_max_body_size 5m;

        location / {
            proxy_pass         http://roast-api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # ---------------------------------------------------------------------------
    # api.undertow.dev  →  Undertow FastAPI (undertow-api:8001)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name api.undertow.dev;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options     nosniff                                       always;

        client_max_body_size 1m;

        location / {
            proxy_pass         http://undertow-api:8001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
