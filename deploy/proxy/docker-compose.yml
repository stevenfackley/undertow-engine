# ---------------------------------------------------------------------------
# Standalone nginx reverse proxy
#
# Prerequisites (run once on the server):
#   docker network create shared_proxy_network
#
# Place TLS certs in deploy/proxy/certs/:
#   fullchain.pem  — certificate + chain
#   privkey.pem    — private key
#
# Start:
#   cd deploy/proxy && docker compose up -d
# ---------------------------------------------------------------------------

version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - shared_proxy_network

networks:
  shared_proxy_network:
    external: true
