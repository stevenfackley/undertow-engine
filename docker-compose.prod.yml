# ---------------------------------------------------------------------------
# docker-compose.prod.yml – Production environment overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars (copy .env.example → .env and fill in):
#   OPENAI_API_KEY, API_KEY, REDIS_PASSWORD, FLOWER_USER, FLOWER_PASSWORD, DOMAIN
# ---------------------------------------------------------------------------

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # nginx reverse proxy — TLS termination for API and Flower
  # Edit nginx/nginx.conf: replace YOUR_DOMAIN / YOUR_FLOWER_DOMAIN.
  # Place certs in nginx/certs/ (fullchain.pem + privkey.pem).
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - flower

  api:
    restart: always
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
    environment:
      - CELERY_ENV=prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_KEY=${API_KEY}
      - CHROMIUM_PROFILE_DIR=/data/chromium-profile
      - OUTPUT_DIR=/data/outputs
    ports: []  # nginx handles ingress; never expose directly

  worker:
    restart: always
    command: >
      celery -A worker.celery_app worker
      --loglevel=warning
      --concurrency=4
    environment:
      - CELERY_ENV=prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMIUM_PROFILE_DIR=/data/chromium-profile
      - OUTPUT_DIR=/data/outputs

  flower:
    image: mher/flower:2.0
    restart: always
    command: >
      celery --broker=redis://:${REDIS_PASSWORD}@redis:6379/0
      flower --port=5555
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports: []  # nginx proxies flower; never expose directly
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  beat:
    restart: always
    command: >
      celery -A worker.celery_app beat --loglevel=warning
      --schedule=/var/celerybeat/celerybeat-schedule
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OUTPUT_DIR=/data/outputs
    volumes:
      - celerybeat:/var/celerybeat

  redis:
    restart: always
    # Password-protected; port NOT exposed to host — only reachable within compose network
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
    ports: []

volumes:
  celerybeat:
