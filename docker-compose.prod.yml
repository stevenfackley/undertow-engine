# ---------------------------------------------------------------------------
# docker-compose.prod.yml – Production environment overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars (.env):
#   OPENAI_API_KEY, API_KEY, REDIS_PASSWORD,
#   FLOWER_USER, FLOWER_PASSWORD,
#   TUNNEL_TOKEN (from: terraform output -raw tunnel_token),
#   DATABASE_URL (Neon) OR SUPABASE_URL + SUPABASE_SERVICE_KEY — pick one
# ---------------------------------------------------------------------------

version: "3.9"

services:
  api:
    container_name: undertow-api          # Docker DNS name used by cloudflared
    restart: always
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8001
      --workers 4
    environment:
      - CELERY_ENV=prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_KEY=${API_KEY}
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - CHROMIUM_PROFILE_DIR=/data/chromium-profile
      - OUTPUT_DIR=/data/outputs
      - LOG_LEVEL=INFO
    ports: []

  worker:
    restart: always
    command: >
      celery -A worker.celery_app worker
      --loglevel=warning
      --concurrency=4
    environment:
      - CELERY_ENV=prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - CHROMIUM_PROFILE_DIR=/data/chromium-profile
      - OUTPUT_DIR=/data/outputs
      - LOG_LEVEL=INFO

  flower:
    image: mher/flower:2.0
    restart: always
    command: >
      celery --broker=redis://:${REDIS_PASSWORD}@redis:6379/0
      flower --port=5555
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports: []
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  beat:
    restart: always
    command: >
      celery -A worker.celery_app beat --loglevel=warning
      --schedule=/var/celerybeat/celerybeat-schedule
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - OUTPUT_DIR=/data/outputs
    volumes:
      - celerybeat:/var/celerybeat

  redis:
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
    ports: []

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  celerybeat:
