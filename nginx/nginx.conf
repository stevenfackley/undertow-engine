# ---------------------------------------------------------------------------
# Undertow Engine – nginx reverse proxy
#
# Before deploying:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g. api.example.com)
#   2. Replace YOUR_FLOWER_DOMAIN (e.g. flower.example.com)
#   3. Place TLS certs in nginx/certs/:
#        fullchain.pem  — certificate + intermediate chain
#        privkey.pem    — private key
#      Recommended: use Certbot (Let's Encrypt)
#        certbot certonly --standalone -d YOUR_DOMAIN -d YOUR_FLOWER_DOMAIN
#        then copy /etc/letsencrypt/live/YOUR_DOMAIN/* → nginx/certs/
# ---------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------------
    # API  https://YOUR_DOMAIN
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            DENY                                           always;
        add_header X-Content-Type-Options     nosniff                                        always;
        add_header X-XSS-Protection           "1; mode=block"                                always;
        add_header Referrer-Policy            "no-referrer"                                  always;

        # Limit request body (video URLs in JSON, not raw uploads)
        client_max_body_size 1m;

        location / {
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    # ---------------------------------------------------------------------------
    # Flower  https://YOUR_FLOWER_DOMAIN
    # Flower itself enforces basic auth (FLOWER_USER / FLOWER_PASSWORD).
    # Restrict further via IP allowlist once you know your VPN/office range.
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name YOUR_FLOWER_DOMAIN;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Uncomment and set your VPN/office CIDR to lock Flower down further:
        # allow 203.0.113.0/24;
        # deny  all;

        location / {
            proxy_pass         http://flower:5555;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
