[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # line too long — not enforced
    "F841",   # local variable assigned but never used (common in stubs)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports fine in test files
