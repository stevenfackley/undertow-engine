[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # line too long — not enforced
    "F841",   # local variable assigned but never used (common in stubs)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports fine in test files

[project]
name = "undertow"
version = "0.1.0"
description = "Undertow Engine"
requires-python = ">=3.11"
dependencies = [
    "celery==5.6.3",
    "fastapi>=0.118.0",
    "httpx>=0.28.0",
    "limits>=2.3,<6.0",
    "openai==2.48.0",
    "playwright==1.61.0",
    "pydub==0.25.1",
    "python-json-logger==4.1.0",
    "python-multipart==0.0.32",
    "redis==8.0.1",
    "slowapi==0.1.10",
    "starlette>=0.47.2",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-httpx",
    "ruff",
]

# Tell setuptools which top-level dir is the Python package.
# Without this, `pip install -e .` (used by ci-python.yml@v1) hits
# "Multiple top-level packages discovered in a flat-layout" because
# the repo has sibling non-package dirs: conductor/, deploy/, infra/, docs/, tests/.
[tool.setuptools.packages.find]
include = ["app*"]

