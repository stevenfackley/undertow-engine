[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # line too long — not enforced
    "F841",   # local variable assigned but never used (common in stubs)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports fine in test files

[project]
name = "undertow"
version = "0.1.0"
description = "Undertow Engine"
requires-python = ">=3.11"
dependencies = [
    "celery==5.6.3",
    "fastapi>=0.118.0",
    "httpx>=0.28.0",
    "limits>=2.3,<4.0",
    "moviepy==1.0.3",
    "openai==1.30.1",
    "playwright==1.44.0",
    "pydub==0.25.1",
    "python-json-logger==4.1.0",
    "python-multipart==0.0.27",
    "redis==5.0.4",
    "slowapi==0.1.9",
    "starlette>=0.47.2",
    "supabase>=2.7.4",
    "uvicorn[standard]==0.46.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-httpx",
    "ruff",
]

