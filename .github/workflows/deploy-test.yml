# ---------------------------------------------------------------------------
# .github/workflows/deploy-test.yml
# CI/CD pipeline – Test / Staging environment
#
# Triggers:
#   • Every push to the `develop` branch
#   • Every pull request targeting `develop`
#
# Required GitHub secrets:
#   AWS_OIDC_ROLE_ARN     — from: terraform output github_actions_role_arn
#   OPENAI_API_KEY        — for test step
# ---------------------------------------------------------------------------

name: Deploy – Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint & unit tests
  # --------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          CELERY_ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest

  # --------------------------------------------------------------------------
  # 2. Build & push Docker image to ECR
  # --------------------------------------------------------------------------
  build:
    name: Build & Push Image (Test)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write   # required for OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: test-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/undertow-engine:$IMAGE_TAG .
          docker push $ECR_REGISTRY/undertow-engine:$IMAGE_TAG
