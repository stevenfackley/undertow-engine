# ---------------------------------------------------------------------------
# .github/workflows/deploy-test.yml
# CI/CD pipeline – Test / Staging environment
#
# Triggers:
#   • Every push to the `develop` branch
#   • Every pull request targeting `develop`
# ---------------------------------------------------------------------------

name: Deploy – Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint & unit tests
  # --------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          CELERY_ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # TODO: replace with your test runner command, e.g.:
          # pytest tests/ -v --tb=short
          echo "No tests configured yet – add pytest invocation here"

  # --------------------------------------------------------------------------
  # 2. Build & push Docker image to registry
  # --------------------------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: test-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/undertow-engine:$IMAGE_TAG .
          docker push $ECR_REGISTRY/undertow-engine:$IMAGE_TAG

  # --------------------------------------------------------------------------
  # 3. Deploy to test/staging environment on AWS
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: build
    permissions: {}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

