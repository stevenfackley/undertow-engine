# ---------------------------------------------------------------------------
# .github/workflows/deploy-prod.yml
# CI/CD pipeline – Production environment
#
# Triggers:
#   • Every push to the `main` branch (i.e. after a PR is merged)
#
# Required GitHub secrets:
#   AWS_OIDC_ROLE_ARN      — from: terraform output github_actions_role_arn
#   PROD_EC2_INSTANCE_ID   — EC2 instance ID (i-xxxxxxxxxxxx)
#   OPENAI_API_KEY         — for test step
# ---------------------------------------------------------------------------

name: Deploy – Production

on:
  push:
    branches:
      - main

jobs:
  # --------------------------------------------------------------------------
  # 1. Build & push Docker image to ECR
  # --------------------------------------------------------------------------
  build:
    name: Build & Push Image (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/undertow-engine:$IMAGE_TAG \
                       -t $ECR_REGISTRY/undertow-engine:latest .
          docker push $ECR_REGISTRY/undertow-engine:$IMAGE_TAG
          docker push $ECR_REGISTRY/undertow-engine:latest

  # --------------------------------------------------------------------------
  # 2. Deploy to production via SSM Run Command
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production   # Requires a GitHub environment approval gate
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        run: |
          echo "Verifying SSM connectivity..."
          # Get the first instance that is online and managed by SSM
          MANAGED_INSTANCE=$(aws ssm describe-instance-information --query "InstanceInformationList[0].InstanceId" --output text)
          
          INSTANCE_ID="${{ secrets.PROD_EC2_INSTANCE_ID }}"
          # Fallback if secret is missing or looks like a placeholder
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "null" ] || [[ "$INSTANCE_ID" == i-xxxxxxxx* ]]; then
            echo "Configured INSTANCE_ID is missing or invalid. Falling back to first available SSM managed instance."
            INSTANCE_ID="$MANAGED_INSTANCE"
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "Error: No managed EC2 instances found in SSM."
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/undertow-engine",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait up to 5 minutes for the command to finish
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Print output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text
