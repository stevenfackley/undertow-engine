# ---------------------------------------------------------------------------
# .github/workflows/deploy-prod.yml
# CI/CD pipeline – Production environment
#
# Triggers:
#   • Every push to the `main` branch (i.e. after a PR is merged)
#
# Required GitHub secrets:
#   AWS_OIDC_ROLE_ARN      — from: terraform output github_actions_role_arn
#   PROD_EC2_INSTANCE_ID   — EC2 instance ID (i-xxxxxxxxxxxx)
#   OPENAI_API_KEY         — for test step
# ---------------------------------------------------------------------------

name: Deploy – Production

on:
  push:
    branches:
      - main

jobs:
  # --------------------------------------------------------------------------
  # 1. Build & push Docker image to ECR
  # --------------------------------------------------------------------------
  build:
    name: Build & Push Image (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/undertow-engine:$IMAGE_TAG \
                       -t $ECR_REGISTRY/undertow-engine:latest .
          docker push $ECR_REGISTRY/undertow-engine:$IMAGE_TAG
          docker push $ECR_REGISTRY/undertow-engine:latest

  # --------------------------------------------------------------------------
  # 2. Deploy to production via SSM Run Command
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production   # Requires a GitHub environment approval gate
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail

          echo "Verifying SSM connectivity..."
          # Get the first instance that is online and managed by SSM
          MANAGED_INSTANCE=$(aws ssm describe-instance-information --query "InstanceInformationList[0].InstanceId" --output text)

          # Auto-resolve taking precedence over potentially stale secret
          INSTANCE_ID="$MANAGED_INSTANCE"

          # Only use secret if auto-discovery failed
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ] || [ "$INSTANCE_ID" == "null" ]; then
            INSTANCE_ID="${{ secrets.PROD_EC2_INSTANCE_ID }}"
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ] || [ "$INSTANCE_ID" == "null" ] || [[ "$INSTANCE_ID" == i-xxxxxxxx* ]]; then
            echo "Error: No managed EC2 instances found in SSM and no valid secret provided."
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          REMOTE_SCRIPT=$(cat <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          APP_DIR="/opt/undertow-engine"
          if [ ! -d "$APP_DIR" ]; then
            echo "Missing required directory: $APP_DIR"
            exit 1
          fi
          cd "$APP_DIR"

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is not installed or not on PATH"
            exit 1
          fi

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            echo "Neither docker compose nor docker-compose is available"
            exit 1
          fi

          for required_file in docker-compose.yml docker-compose.prod.yml .env; do
            if [ ! -f "$required_file" ]; then
              echo "Missing required file: $APP_DIR/$required_file"
              exit 1
            fi
          done

          $COMPOSE_CMD -f docker-compose.yml -f docker-compose.prod.yml pull
          $COMPOSE_CMD -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
          BASH
          )

          REMOTE_SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)
          SSM_PARAMETERS=$(jq -cn \
            --arg script_b64 "$REMOTE_SCRIPT_B64" \
            '{commands: [
              "echo \"$script_b64\" | base64 -d > /tmp/undertow-deploy.sh",
              "chmod +x /tmp/undertow-deploy.sh",
              "/bin/bash /tmp/undertow-deploy.sh"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$SSM_PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for command to finish — capture exit code so we can always show output
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          # Always retrieve command output and details for diagnostics
          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --plugin-name "aws:runShellScript" \
            --output json || true)

          INVOCATION_DETAILS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --instance-id "$INSTANCE_ID" \
            --output json || true)

          echo "SSM waiter exit code: $WAIT_EXIT"
          echo "--- SSM Invocation Summary ---"
          echo "$INVOCATION" | jq -r '. | {Status, StatusDetails, ResponseCode, ExecutionStartDateTime, ExecutionElapsedTime} // {}'
          echo "--- SSM Command Invocation Details ---"
          echo "$INVOCATION_DETAILS" | jq -r '.CommandInvocations[0] // {}'
          echo "--- SSM Command Output ---"
          echo "$INVOCATION" | jq -r '.Stdout // "(no stdout)"'
          echo "--- SSM Command Stderr ---"
          echo "$INVOCATION" | jq -r '.Stderr // "(no stderr)"'

          STATUS=$(echo "$INVOCATION" | jq -r '.Status // "Unknown"')
          RESPONSE_CODE=$(echo "$INVOCATION" | jq -r '.ResponseCode // "Unknown"')
          echo "SSM command status: $STATUS (response code: $RESPONSE_CODE)"

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command failed with status: $STATUS (response code: $RESPONSE_CODE)"
            exit 1
          fi
