# ---------------------------------------------------------------------------
# .github/workflows/deploy-prod.yml
# CI/CD pipeline – Production environment
# ---------------------------------------------------------------------------

name: Deploy – Production

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Serialize prod deploys. A burst of merges to main (e.g. a Dependabot
# batch) otherwise fans out into overlapping runs that race the same EC2
# box via SSM. cancel-in-progress is intentionally false: an in-flight SSM
# Run Command keeps executing on the box even after the GitHub job is
# cancelled, so cancelling would orphan a half-applied `docker compose up`
# and let two deploys clobber each other. Queue instead — each run finishes
# cleanly, latest commit applies last.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Image (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/undertow-engine:$IMAGE_TAG \
                       -t $ECR_REGISTRY/undertow-engine:latest .
          docker push $ECR_REGISTRY/undertow-engine:$IMAGE_TAG
          docker push $ECR_REGISTRY/undertow-engine:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        run: |
          # Target the dedicated undertow host by tag, not the first online SSM
          # instance in the account. The old `[0]` query grabbed whatever box
          # sorted first (it was landing deploys on the synap server). The
          # instance is tagged App=undertow in infra/ec2.tf.
          echo "Resolving undertow prod instance by tag App=undertow..."
          # SSM forbids mixing a tag filter with any other filter, so keep only
          # the tag filter server-side and select Online instances in the query.
          MANAGED_INSTANCE=$(aws ssm describe-instance-information \
            --filters "Key=tag:App,Values=undertow" \
            --query "InstanceInformationList[?PingStatus=='Online'].InstanceId | [0]" \
            --output text 2>/dev/null || echo None)

          INSTANCE_ID="$MANAGED_INSTANCE"
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ]; then
            INSTANCE_ID="${{ secrets.PROD_EC2_INSTANCE_ID }}"
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ] || [[ "$INSTANCE_ID" == i-xxxxxxxx* ]]; then
            echo "Error: No online SSM-managed EC2 instance found and no valid secret provided."
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /opt",
              "cd /opt",
              "if [ ! -d \"undertow-engine\" ]; then git clone https://github.com/stevenfackley/undertow-engine.git; fi",
              "cd undertow-engine",
              "git fetch origin && git reset --hard origin/main",
              "if docker compose version >/dev/null 2>&1; then COMPOSE=\"docker compose\"; else COMPOSE=\"docker-compose\"; fi",
              "$COMPOSE -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Manual polling loop instead of `aws ssm wait command-executed`.
          # The built-in waiter is hardcoded to 30 attempts × 5s = 150s — too short
          # for the Python+FastAPI+Playwright+Chromium ARM image rebuild on a cold
          # cache, which takes 2-3+ minutes. Manual poll lets us set a real budget.
          # See 2026-04-19 audit (run 24591135453) and 2026-05-13 audit recurrence.
          DEADLINE=$(( $(date +%s) + 900 ))   # 15 min total budget
          EXIT_CODE=0
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "PollError")

            case "$STATUS" in
              Success)
                echo "Deploy command succeeded on instance."
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy command ended with terminal status: $STATUS"
                EXIT_CODE=1
                break
                ;;
              Pending|InProgress|Delayed|PollError)
                if [ "$(date +%s)" -gt "$DEADLINE" ]; then
                  echo "Workflow-side timeout (15m) — command still $STATUS on the instance."
                  EXIT_CODE=2
                  break
                fi
                echo "Status: $STATUS — polling again in 10s"
                sleep 10
                ;;
              *)
                echo "Unexpected status: $STATUS — treating as failure."
                EXIT_CODE=1
                break
                ;;
            esac
          done

          # Always print the full stdout/stderr from the on-box script so the
          # workflow log shows what actually happened (build, compose-up, etc).
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text

          exit "$EXIT_CODE"
