# ---------------------------------------------------------------------------
# .github/workflows/deploy-prod.yml
# CI/CD pipeline – Production environment
# ---------------------------------------------------------------------------

name: Deploy – Production

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build & Push Image (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/undertow-engine:$IMAGE_TAG \
                       -t $ECR_REGISTRY/undertow-engine:latest .
          docker push $ECR_REGISTRY/undertow-engine:$IMAGE_TAG
          docker push $ECR_REGISTRY/undertow-engine:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        run: |
          echo "Verifying SSM connectivity..."
          MANAGED_INSTANCE=$(aws ssm describe-instance-information --query "InstanceInformationList[?PingStatus=='Online'] | [0].InstanceId" --output text)

          INSTANCE_ID="$MANAGED_INSTANCE"
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ]; then
            INSTANCE_ID="${{ secrets.PROD_EC2_INSTANCE_ID }}"
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ] || [[ "$INSTANCE_ID" == i-xxxxxxxx* ]]; then
            echo "Error: No online SSM-managed EC2 instance found and no valid secret provided."
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /opt",
              "cd /opt",
              "if [ ! -d \"undertow-engine\" ]; then git clone https://github.com/stevenfackley/undertow-engine.git; fi",
              "cd undertow-engine",
              "git fetch origin && git reset --hard origin/main",
              "if docker compose version >/dev/null 2>&1; then COMPOSE=\"docker compose\"; else COMPOSE=\"docker-compose\"; fi",
              "$COMPOSE -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text

          if [ "$WAIT_EXIT" -ne 0 ]; then
            exit "$WAIT_EXIT"
          fi
