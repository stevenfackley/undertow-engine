version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    ignore:
      # pydantic-core is version-locked to pydantic (exact == pin upstream).
      # Standalone core bumps outrun pydantic and break pip resolution at
      # Docker build (2026-06-11, core 2.47.0 vs pydantic 2.13.4). Let core
      # move only when a pydantic bump drags it.
      - dependency-name: "pydantic-core"
      # pyiceberg 0.11.x caps rich<15. Block rich majors until pyiceberg
      # supports 15 (2026-06-11, deploy ResolutionImpossible).
      - dependency-name: "rich"
        update-types: ["version-update:semver-major"]
      # pyiceberg 0.11.x caps cachetools<7. Block cachetools majors until
      # pyiceberg supports 7 (2026-06-13, deploy ResolutionImpossible at
      # Docker build: cachetools 7.1.4 vs pyiceberg 0.11.1).
      - dependency-name: "cachetools"
        update-types: ["version-update:semver-major"]
      # supabase realtime 2.31.x caps websockets<16. Block websockets majors
      # until realtime widens (2026-06-13, deploy ResolutionImpossible at
      # Docker build: websockets 16.0 vs realtime 2.31.0).
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
