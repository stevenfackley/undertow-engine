# ---------------------------------------------------------------------------
# docker-compose.test.yml – Test environment overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up
# ---------------------------------------------------------------------------

version: "3.9"

services:
  api:
    environment:
      - CELERY_ENV=test
      - REDIS_TEST_URL=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/1
    # Disable hot-reload in CI; use a plain uvicorn command
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    environment:
      - CELERY_ENV=test
      - REDIS_TEST_URL=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/1
    command: >
      celery -A worker.celery_app worker
      --loglevel=debug
      --concurrency=1
