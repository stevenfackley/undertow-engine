# ---------------------------------------------------------------------------
# docker-compose.yml – Base configuration
# Shared by test and production override files.
# ---------------------------------------------------------------------------

# Cap json-file logging at 50 MB × 3 rotations per container.
# Without this, long-running containers (especially Celery workers driving
# headless Chromium) can accumulate multi-GB log files and exhaust the root
# volume — exactly what happened on prod 2026-05-11 (single worker container
# wrote 13 GiB of JSON log over 30 days, wedged the box for two days).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # --------------------------------------------------------------------------
  # FastAPI web API
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: undertow-engine:latest
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-}
      - CHROMIUM_PROFILE_DIR=/data/chromium-profile
      - OUTPUT_DIR=/data/outputs
    volumes:
      - chromium_profile:/data/chromium-profile
      - outputs:/data/outputs
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Celery worker
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: undertow-engine:latest
    command: >
      celery -A worker.celery_app worker
      --loglevel=info
      --concurrency=2
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-}
      - CHROMIUM_PROFILE_DIR=/data/chromium-profile
      - OUTPUT_DIR=/data/outputs
      - DLQ_DIR=/data/dlq
    volumes:
      - chromium_profile:/data/chromium-profile
      - outputs:/data/outputs
      # Dead-letter records must survive container recreation (every deploy
      # runs `up --build`), so the DLQ lives on its own named volume.
      - dlq:/data/dlq
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Flower – Celery monitoring UI  (http://localhost:5555)
  # --------------------------------------------------------------------------
  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Celery beat scheduler (periodic tasks)
  # --------------------------------------------------------------------------
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: undertow-engine:latest
    command: >
      celery -A worker.celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-}
      - OUTPUT_DIR=/data/outputs
    volumes:
      - outputs:/data/outputs
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Redis broker / result backend
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - if [ -n "$${REDIS_PASSWORD}" ]; then redis-cli -a "$${REDIS_PASSWORD}" ping; else redis-cli ping; fi
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

volumes:
  chromium_profile:
  outputs:
  dlq:
